plugins {
    id 'com.android.application'
}

android {
    namespace 'com.combodrive.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.combodrive.game'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
}